name: Sync and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0,6,12,18 * * *' # Every six hours, on the hour, UTC
  workflow_dispatch:
    inputs:
      refresh_artwork_and_colors:
        description: Force rebuild artwork and color caches
        type: boolean
        default: false
        required: false

concurrency:
  group: music-stats-sync
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ingestion regression tests
        run: npm test

      - name: Ensure Data Directory Exists
        run: mkdir -p src/data public/data

      - name: Download Database from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp s3://music-stats/scrobbles.csv src/data/scrobbles.csv --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          aws s3 cp s3://music-stats/artwork.json src/data/artwork.json --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # colors.json is sharded into public/data/colors/NN.json; readDataset()
          # reassembles the directory, and writeDataset() deletes the monolith.
          aws s3 sync s3://music-stats/colors/ public/data/colors/ --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # Without this the Last.fm enrichment restarts from empty every run and
          # re-fetches the whole catalogue (~13k requests) instead of just what's new.
          aws s3 cp s3://music-stats/recap-meta-cache.json src/data/recap-meta-cache.json --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Fetch Latest Scrobbles
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
        run: node scripts/fetch-lastfm.js

      - name: Log sync summary
        run: |
          lines=$(wc -l < src/data/scrobbles.csv | tr -d ' ')
          echo "scrobbles.csv row count (incl. header): $lines"
          if [ "$lines" -le 1 ]; then
            echo "::error::scrobbles.csv is empty after fetch — sync may have failed"
            exit 1
          fi

      - name: Build and Deploy
        env:
          CACHE_VERSION: ${{ github.run_number }}-${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          # Bounds a cold-cache run; the cache is restored from R2 so coverage
          # converges across scheduled runs rather than stalling one build for an hour.
          RECAP_TRACK_LIMIT: '4000'
          RECAP_ARTIST_LIMIT: '2000'
          # Full re-resolve: tick the box on a manual run, or put [refresh artwork]
          # in any commit message of a push to main. Every commit in the push is
          # checked, not just the head, so it survives being pushed mid-stack.
          REFRESH_MEDIA: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_artwork_and_colors == 'true') || (github.event_name == 'push' && contains(join(github.event.commits.*.message, ' '), '[refresh artwork]')) }}
        run: |
          if [ "$REFRESH_MEDIA" = "true" ]; then
            echo "Running full artwork + color cache refresh (build:refresh)"
            npm run build:refresh
          else
            echo "Running incremental build (backfill missing artwork + new colors only)"
            npm run build
          fi

      - name: Verify build artifacts
        run: |
          npm run check
          npm run check:data
          test -f dist/data/manifest.json
          test -f dist/data/meta.json
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('dist/data/manifest.json', 'utf8'));
            const meta = JSON.parse(fs.readFileSync('dist/data/meta.json', 'utf8'));
            if (!manifest.generation || !manifest.builtAt) throw new Error('manifest missing generation/builtAt');
            if (!Array.isArray(manifest.files) || manifest.files.length < 5) throw new Error('manifest file list too small');
            if (!Array.isArray(meta.tracks) || meta.tracks.length === 0) throw new Error('meta.json has no tracks');
            console.log('✓ generation', manifest.generation);
            console.log('✓ builtAt', manifest.builtAt);
            console.log('✓ data files', manifest.files.length);
            console.log('✓ tracks', meta.tracks.length);
          "

      - name: Install browser for regression checks
        run: npx playwright install --with-deps chromium

      - name: Verify startup, refresh, offline, and scrolling
        run: npm run test:browser

      - name: Upload browser regression screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-screenshots
          path: /tmp/music-*.png
          if-no-files-found: ignore

      - name: Upload Updated Database back to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          backup_slot=$(( ${{ github.run_number }} % 28 ))
          aws s3 cp src/data/scrobbles.csv.previous "s3://music-stats/backups/scrobbles-${backup_slot}.csv" --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          aws s3 cp src/data/scrobbles.csv s3://music-stats/scrobbles.csv --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          aws s3 cp src/data/artwork.json s3://music-stats/artwork.json --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          aws s3 sync public/data/colors/ s3://music-stats/colors/ --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          aws s3 cp src/data/recap-meta-cache.json s3://music-stats/recap-meta-cache.json --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=music-stats
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
